# Single Railway service: starts notification API + runs vehicle scheduler once (child process).
# Variables: ACCESS_TOKEN (required). Optional: RUN_VEHICLE_SCHEDULER=false to disable the scheduler.
# Railway injects PORT — do not set manually unless needed.

[build]
builder = "nixpacks"
buildCommand = "npm run railway:build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
